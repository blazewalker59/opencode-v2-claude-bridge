name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  opencode:
    # Loads the plugin in a real OpenCode, from the checkout and from the packed
    # tarball. Claude Code is not installed here, and the smoke test points the
    # plugin at a missing executable, so no Claude request is possible.
    name: Plugin load (OpenCode ${{ matrix.opencode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode: ["2.0.21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @opencode/cli@${{ matrix.opencode }}
      - run: opencode --version
      - run: npm run build
      - run: npm run smoke:opencode
      - run: npm run smoke:package
