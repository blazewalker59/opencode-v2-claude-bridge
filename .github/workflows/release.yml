name: Release

# Pushing a vX.Y.Z tag on main packs the plugin tarball, checks it in a real
# OpenCode, and attaches it to a GitHub release with its SHA-256 checksum and
# signed build provenance (`gh attestation verify`).
#
# - package: packs the tarball from a clean install that runs no
#   dependency install scripts, so nothing but the compiler touches it.
# - verify: runs the tests and both OpenCode smoke tests against that exact
#   tarball. This job installs OpenCode and runs third-party code, so it never
#   produces what is released.
# - publish: checks the tarball is byte-for-byte what package produced,
#   records provenance, and creates the release. It is the only job that can
#   write to the repository, and it runs no project code.
#
# These checks run from the workflow file at the tagged commit, so they guard
# against mistakes, not against someone with push access; a tag ruleset on
# v* tags is what restricts who can release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      # The exact file to publish, and its digest, so publish can check it was not swapped.
      tarball: ${{ steps.pack.outputs.name }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tag's commit can be checked against main.
          fetch-depth: 0
      # No dependency cache: a release installs from the lockfile with nothing carried over from other runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main" >&2
            exit 1
          fi

      - name: Tag matches package.json and CHANGELOG.md
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $version (## [$version] - YYYY-MM-DD)" >&2
            exit 1
          fi
          unreleased="$(awk '/^## \[Unreleased\]/ { on = 1; next } on && /^## \[/ { exit } on && NF { print }' CHANGELOG.md)"
          if [ -n "$unreleased" ]; then
            echo "CHANGELOG.md still has notes under [Unreleased]; move them under $version" >&2
            exit 1
          fi

      # Dependency install scripts never run here; the build only needs the compiler.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Pack
        id: pack
        run: |
          mkdir -p release
          # --ignore-scripts: dist/ was just built; prepack would only build it again.
          file="$(npm pack --ignore-scripts --pack-destination release --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')"
          (cd release && sha256sum "$file" > "$file.sha256")
          echo "name=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 "release/$file.sha256")" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  verify:
    needs: package
    runs-on: ubuntu-latest
    env:
      OPENCODE_VERSION: "2.0.21"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install --global @opencode/cli@${OPENCODE_VERSION}
      - run: npm run build
      - run: npm run smoke:opencode

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # The tarball being released: its file list, then installed by OpenCode itself.
      - run: node scripts/package-smoke.mjs "$TARBALL"
        env:
          TARBALL: release/${{ needs.package.outputs.tarball }}

  publish:
    needs: [package, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance (OIDC) and storing it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Tarball is the one package produced
        env:
          TARBALL: release/${{ needs.package.outputs.tarball }}
          EXPECTED: ${{ needs.package.outputs.sha256 }}
        run: |
          actual="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "Digest mismatch: $actual, expected $EXPECTED" >&2
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/${{ needs.package.outputs.tarball }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: release/${{ needs.package.outputs.tarball }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release/notes.md "$TARBALL" "$TARBALL.sha256"
